<!DOCTYPE html>
<html>
<head>
<title>Start 💖</title>

<style>
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#fff);
}

.glow{
  color:#ff4d6d;
  text-shadow:0 0 10px #ff4d6d;
}

button,input{
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

button{
  background:#ff4d6d;
  color:white;
}
</style>
</head>

<body>

<div style="text-align:center">
<h2 class="glow">Enter your name 💖</h2>
<input id="name" placeholder="Dilushan">
<br>
<button onclick="go()">Start</button>
</div>

<script>
function go(){
  let n = document.getElementById("name").value || "Dilushan";
  localStorage.setItem("name", n);
  window.location.href="game1.html";
}
</script>

</body>
</html>
